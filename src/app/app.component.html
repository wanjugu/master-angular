<app-header />

<main>
  <ul id="users">
    @for (user of users; track user.id) {

    <li>
      <app-user [user]="user" (select)="onSelectUser($event)"/>
    </li>
    }
  </ul>
  <div>   
     LIST OF TASKS
     @if(selectedUser){
         <app-task [name]="selectedUser.name"></app-task>
     }
   
</div>


</main>
